services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chefmind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recipe_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipe_pass123}
      POSTGRES_DB: ${POSTGRES_DB:-recipe_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recipe_admin} -d ${POSTGRES_DB:-recipe_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chefmind-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 覆盖 .env 中的本地值，指向 Compose 内部服务名
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  