[project]
name = "chefmind-backend"
version = "0.1.0"
description = "ChefMind 厨思 后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "pgvector>=0.3.0",
    "openai>=1.50.0",
    "langchain-text-splitters>=0.3.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "langgraph-checkpoint-postgres>=3.2.1",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "httpx>=0.28.1",
    "email-validator>=2.4.0",
    "python-multipart>=0.0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
